  <h3 class="head-mzd" title="无产阶级文化大革命的实质" id="calibre_pb_0">无产阶级文化大革命的实质<br class="calibre3"/><b class="calibre9">（一九六八年）</b></h3>

  <p class="calibre10">无产阶级文化大革命，实质上是在社会主义条件下，无产阶级反对资产阶级和一切剥削阶级的政治大革命，是中国共产党及其领导下的广大革命人民群众和国民党反动派长期斗争的继续，是无产阶级和资产阶级阶级斗争的继续。</p>
