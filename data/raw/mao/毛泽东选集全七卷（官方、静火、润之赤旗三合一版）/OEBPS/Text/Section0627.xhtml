    <title>对刘少奇、杨尚昆破坏纪律擅自以中央名义发出文件的批评</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <link rel="stylesheet" type="text/css" href="../../stylesheet.css"/>
<link rel="stylesheet" type="text/css" href="../../page_styles.css"/>

  <body class="calibre">
  <h3 class="head-mzd" title="对刘少奇、杨尚昆破坏纪律擅自 以中央名义发出文件的批评" id="calibre_pb_0">对刘少奇、杨尚昆破坏纪律擅自<br class="calibre3"/>以中央名义发出文件的批评<sup class="calibre7"><a class="duokan-footnote" href="#ref_footnotebookmark_end_1_1388" id="ref_footnotebookmark_start_1_1388"><img alt="" src="../Images/note.png" class="calibre8"/></a></sup><br class="calibre3"/><b class="calibre9">（一九五三年五月十九日）</b></h3>

  <div class="epigraph">
    <p class="calibre12">一</p>
  </div>

  <p class="calibre3" style="margin:0pt; border:0pt; height:1em"> </p>

  <p class="calibre10">嗣后，凡用中央名义发出的文件、电报，均须经我看过方能发出，<span class="tepi">否则无效</span>。请注意。</p>

  <p class="calibre3" style="margin:0pt; border:0pt; height:1em"> </p>

  <div class="epigraph">
    <p class="calibre12">二</p>
  </div>

  <p class="calibre3" style="margin:0pt; border:0pt; height:1em"> </p>

  <p class="calibre10">（一）请负责检查自去年八月一日（八一以前的有过检查）至今年五月五日用中央和军委名义发出的电报和文件，是否有及有多少未经我看过的（我出巡及患病请假时间内者不算在内），以其结果告我；</p>

  <p class="calibre10">（二）过去数次中央会议决议不经我看，擅自发出，是错误的，是破坏纪律的。</p>

  <ol class="duokan-footnote-content">
    <li class="duokan-footnote-item" id="ref_footnotebookmark_end_1_1388"><p class="footnote"><a href="#ref_footnotebookmark_start_1_1388" class="duokan-footnote">◎</a>这是毛泽东同志对刘少奇、杨尚昆的两次书面批评。</p></li>
  </ol>
</body>
</html>
