  <h3 class="head-mzd" title="知识青年到农村去" id="calibre_pb_0">知识青年到农村去<br class="calibre3"/><b class="calibre9">（一九六八年）</b></h3>

  <p class="calibre10">知识青年到农村去，接受贫下中农的再教育，很有必要。要说服城里干部和其他人，把自己初中、高中、大学毕业的子女，送到乡下去，来一个动员。各地农村的同志应当欢迎他们去。</p>
