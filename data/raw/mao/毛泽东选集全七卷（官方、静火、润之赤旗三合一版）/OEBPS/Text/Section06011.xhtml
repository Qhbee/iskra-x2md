  <h3 class="head-mzd" title="中国人民志愿军要爱护朝鲜的一山一水一草一木" id="calibre_pb_0">中国人民志愿军要爱护朝鲜的<br class="calibre3"/>一山一水一草一木<sup class="calibre7"><a class="duokan-footnote" href="#ref_footnotebookmark_end_1_1368" id="ref_footnotebookmark_start_1_1368"><img alt="" src="../Images/note.png" class="calibre8"/></a></sup><br class="calibre3"/><b class="calibre9">（一九五一年一月十九日）</b></h3>

  <p class="calibre10">中朝两国同志要亲如兄弟般地团结在一起，休戚与共，生死相依，为战胜共同敌人而奋斗到底。中国同志必须将朝鲜的事情看做自己的事情一样，教育指挥员战斗员爱护朝鲜的一山一水一草一木，不拿朝鲜人民的一针一线，如同我们在国内的看法和做法一样，这就是胜利的政治基础。只要我们能够这样做，最后胜利就一定会得到。</p>

  <ol class="duokan-footnote-content">
    <li class="duokan-footnote-item" id="ref_footnotebookmark_end_1_1367"><p class="footnote"><a href="#ref_footnotebookmark_start_1_1367" class="duokan-footnote">◎</a>这是毛泽东同志给中国人民志愿军的指示。</p></li>
  </ol>
