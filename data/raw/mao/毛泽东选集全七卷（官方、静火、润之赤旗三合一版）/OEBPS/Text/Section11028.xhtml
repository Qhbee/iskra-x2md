  <h3 class="head-mzd" title="要将斗争水平提高" id="calibre_pb_0">要将斗争水平提高<sup class="calibre7"><a class="duokan-footnote" href="#E-这是毛泽东同志关于斗争方式方法问题的指示。" id="F-这是毛泽东同志关于斗争方式方法问题的指示。"><img alt="" src="../Images/note.png" class="calibre8"/></a></sup><br class="calibre3"/><b class="calibre9">（一九六七年二月三日）</b></h3>

  <p class="calibre10">斗争要文明些，我们是无产阶级专政，要高姿态，要高风格。北京街头上标语水平不高，到处都打倒、砸烂狗头，哪有那么多的狗头，都是人头。这样搞群众很难理解。搞喷气式飞机照相片，登报贴在大街上被外国记者搞走了。现在要将斗争水平提高，现在水平太低。</p>

  <p class="calibre10">八月初，也没这凶嘛，斗倒斗臭要在政治上斗臭，要对后代进行教育。不然他们将来掌权了，也这样干，这就太简单化了。他们认为这样就斗臭了。还有把别人生活上的问题摆出来也叫斗臭了，我看不合适。主要是政治上斗臭。</p>
