  <h3 class="head-mzd" title="同华国锋谈话时写的几句话" id="calibre_pb_0">同华国锋谈话时写的几句话<sup class="calibre7"><a class="duokan-footnote" href="#E-本篇一、二、三是毛泽东同志一九七六年四月三十日晚同中共中央第一副主席、国务院总理华国锋同志谈话时写的三句话。本篇四是毛泽东同志一九七六年六月二十五日下午三时同华国锋同志谈话时写的一句话。毛泽东同志在生命的最后时刻，将党和国家的重担交给了华国锋同志。" id="F-本篇一、二、三是毛泽东同志一九七六年四月三十日晚同中共中央第一副主席、国务院总理华国锋同志谈话时写的三句话。本篇四是毛泽东同志一九七六年六月二十五日下午三时同华国锋同志谈话时写的一句话。毛泽东同志在生命的最后时刻，将党和国家的重担交给了华国锋同志。"><img alt="" src="../Images/note.png" class="calibre8"/></a></sup><br class="calibre3"/><b class="calibre9">（一九七六年四月三十日、六月二十五日）</b></h3>



  <div class="epigraph">
    <p class="calibre12">一</p>
  </div>

  <p class="calibre3" style="margin:0pt; border:0pt; height:1em"> </p>
  <p class="calibre25">慢慢来，不要着急。</p>

  <p class="calibre3" style="margin:0pt; border:0pt; height:1em"> </p>

  <div class="epigraph">
    <p class="calibre12">二</p>
  </div>

  <p class="calibre3" style="margin:0pt; border:0pt; height:1em"> </p>
  <p class="calibre25">照过去方针办。</p>

  <p class="calibre3" style="margin:0pt; border:0pt; height:1em"> </p>

  <div class="epigraph">
    <p class="calibre12">三</p>
  </div>

  <p class="calibre3" style="margin:0pt; border:0pt; height:1em"> </p>
  <p class="calibre25">你办事，我放心。</p>

  <p class="calibre3" style="margin:0pt; border:0pt; height:1em"> </p>

  <div class="epigraph">
    <p class="calibre12">四</p>
  </div>

  <p class="calibre3" style="margin:0pt; border:0pt; height:1em"> </p>
  <p class="calibre25">国内问题要注意。</p>

  <ol class="duokan-footnote-content">
    <li class="duokan-footnote-item" id="E-本篇一、二、三是毛泽东同志一九七六年四月三十日晚同中共中央第一副主席、国务院总理华国锋同志谈话时写的三句话。本篇四是毛泽东同志一九七六年六月二十五日下午三时同华国锋同志谈话时写的一句话。毛泽东同志在生命的最后时刻，将党和国家的重担交给了华国锋同志。"><p class="footnote"><a href="#F-本篇一、二、三是毛泽东同志一九七六年四月三十日晚同中共中央第一副主席、国务院总理华国锋同志谈话时写的三句话。本篇四是毛泽东同志一九七六年六月二十五日下午三时同华国锋同志谈话时写的一句话。毛泽东同志在生命的最后时刻，将党和国家的重担交给了华国锋同志。" class="duokan-footnote">◎</a>本篇一、二、三是毛泽东同志一九七六年四月三十日晚同中共中央第一副主席、国务院总理华国锋同志谈话时写的三句话。本篇四是毛泽东同志一九七六年六月二十五日下午三时同华国锋同志谈话时写的一句话。毛泽东同志在生命的最后时刻，将党和国家的重担交给了华国锋同志。</p></li>
  </ol>
