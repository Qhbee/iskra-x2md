  <h3 class="head-mzd" title="越讲缓和越备战" id="calibre_pb_0">越讲缓和越备战<sup class="calibre7"><a class="duokan-footnote" href="#E-这是毛泽东同志一九七四年十二月二十三日至二十七日在长沙听取周恩来同志等汇报四届人大筹备工作情况时讲话的节录。" id="F-这是毛泽东同志一九七四年十二月二十三日至二十七日在长沙听取周恩来同志等汇报四届人大筹备工作情况时讲话的节录。"><img alt="" src="../Images/note.png" class="calibre8"/></a></sup><br class="calibre3"/><b class="calibre9">（一九七四年十二月）</b></h3>



  <p class="calibre10">越讲缓和越备战。现在可以不提当前世界主要倾向是革命，而要强调备战紧张，各国人民对此要有所准备。要弄清苏联对我试探的真正意图。如果勃列日涅夫<sup class="calibre11"><a class="duokan-footnote" href="#A-1" id="B-1"><img alt="" src="../Images/note.png" class="calibre8"/></a></sup>要来谈，应该怎样？<span class="underline">（周恩来说：如他真想来谈，可考虑，但我们不能去请他。毛泽东点头。）</span></p>

  <ol class="duokan-footnote-content">

  <li class="duokan-footnote-item" id="A-1"><p class="footnote"><a href="#B-1" class="duokan-footnote">◎</a>勃列日涅夫，当时任苏联共产党中央委员会总书记、最高苏维埃主席团主席。</p></li>


    <li class="duokan-footnote-item" id="E-这是毛泽东同志一九七四年十二月二十三日至二十七日在长沙听取周恩来同志等汇报四届人大筹备工作情况时讲话的节录。"><p class="footnote"><a href="#F-这是毛泽东同志一九七四年十二月二十三日至二十七日在长沙听取周恩来同志等汇报四届人大筹备工作情况时讲话的节录。" class="duokan-footnote">◎</a>这是毛泽东同志一九七四年十二月二十三日至二十七日在长沙听取周恩来同志等汇报四届人大筹备工作情况时讲话的节录。</p></li>
  </ol>
