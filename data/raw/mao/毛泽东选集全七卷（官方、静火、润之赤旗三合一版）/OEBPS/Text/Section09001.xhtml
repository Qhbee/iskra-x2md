  <h3 class="head-mzd" title="在杭州会议上的讲话提纲" id="calibre_pb_0">在杭州会议<sup class="calibre7"><a class="duokan-footnote" href="#A-1" id="B-1"><img alt="" src="../Images/note.png" class="calibre8"/></a></sup>上的讲话提纲<br class="calibre3"/><b class="calibre9">（一九五八年一月）</b></h3>

  <p class="calibre10">两类矛盾：敌我；人民内部</p>

  <p class="calibre10">人民内部：阶级矛盾；先进落后矛盾</p>

  <p class="calibre10">主要：阶级矛盾<span class="underline">（过渡时期）</span></p>

  <p class="calibre10">大量：先进、落后</p>

  <p class="calibre10">原因：资产阶级思想影响劳动人民；主观主义的原因；</p>

  <p class="calibre10">领导的原因——领导好，形势先进占多数，落后迅速克服</p>

  <p class="calibre10">经常把几个问题放在心里想一想，同少数人吹一吹，这是一个重要方法。</p>

  <ol class="duokan-footnote-content">
    <li class="duokan-footnote-item" id="A-1"><p class="footnote"><a href="#B-1" class="duokan-footnote">◎</a>杭州会议，指一九五八年一月上旬毛泽东同志在杭州召集的有部分省、市委书记参加的工作会议。</p></li>
  </ol>
