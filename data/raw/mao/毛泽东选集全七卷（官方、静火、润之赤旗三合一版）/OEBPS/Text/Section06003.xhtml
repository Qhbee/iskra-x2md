  <h3 class="head-mzd" title="人民英雄们永垂不朽" id="calibre_pb_0">人民英雄们永垂不朽<sup class="calibre7"><a class="duokan-footnote" href="#ref_footnotebookmark_end_1_1355" id="ref_footnotebookmark_start_1_1355"><img alt="" src="../Images/note.png" class="calibre8"/></a></sup><br class="calibre3"/><b class="calibre9">（一九四九年九月三十日）</b></h3>

  <p class="calibre10"><span class="tepi">三年以来，在人民解放战争和人民革命中牺牲的人民英雄们永垂不朽！</span></p>

  <p class="calibre10"><span class="tepi">三十年以来，在人民解放战争和人民革命中牺牲的人民英雄们永垂不朽！</span></p>

  <p class="calibre10"><span class="tepi">由此上溯到一千八百四十年，从那时起，为了反对内外敌人，争取民族独立和人民自由幸福，在历次斗争中牺牲的人民英雄们永垂不朽 ！</span></p>

  <ol class="duokan-footnote-content">
    <li class="duokan-footnote-item" id="ref_footnotebookmark_end_1_1355"><p class="footnote"><a href="#ref_footnotebookmark_start_1_1355" class="duokan-footnote">◎</a>这是毛泽东同志为人民英雄纪念碑起草的碑文。</p></li>
  </ol>
