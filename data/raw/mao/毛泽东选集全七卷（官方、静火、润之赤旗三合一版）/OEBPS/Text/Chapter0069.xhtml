  <h3 class="head-mzd" title="从现在起就要有所准备" id="calibre_pb_0">从现在起就要有所准备<sup class="calibre7"><a class="duokan-footnote" href="#E-这是毛泽东同志在国庆二十周年口号送审稿上加的一句口号。" id="F-这是毛泽东同志在国庆二十周年口号送审稿上加的一句口号。"><img alt="" src="../Images/note.png" class="calibre8"/></a></sup><br class="calibre3"/><b class="calibre9">（一九六九年九月）</b></h3>

  <p class="calibre10">全世界人民团结起来，反对任何帝国主义、社会帝国主义发动的侵略战争，特别要反对以原子弹为武器的侵略战争！如果这种战争发生，全世界人民就应以革命战争消灭侵略战争，从现在起就要有所准备！</p>
